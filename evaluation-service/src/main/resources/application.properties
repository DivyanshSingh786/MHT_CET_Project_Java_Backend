spring.application.name=evaluation-service
server.port=8083

spring.datasource.url=jdbc:h2:mem:mhtcet_evaluation;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Target URLs for Service 1 and Service 2
qbank.service.url=http://localhost:8081
testengine.service.url=http://localhost:8082

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true