spring.application.name=api-gateway
server.port=8080

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970

# Public Route: Identity Service (No JWT required)
spring.cloud.gateway.server.webflux.routes[0].id=identity-route
spring.cloud.gateway.server.webflux.routes[0].uri=lb://identity-service
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/auth/**

# Protected Route 1: Question Bank Service
spring.cloud.gateway.server.webflux.routes[1].id=question-bank-route
spring.cloud.gateway.server.webflux.routes[1].uri=lb://question-bank-service
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/questions/**
spring.cloud.gateway.server.webflux.routes[1].filters[0]=JwtAuthFilter

# Protected Route 2: Test Engine Service
spring.cloud.gateway.server.webflux.routes[2].id=test-engine-route
spring.cloud.gateway.server.webflux.routes[2].uri=lb://test-engine-service
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/attempts/**
spring.cloud.gateway.server.webflux.routes[2].filters[0]=JwtAuthFilter

# Protected Route 3: Evaluation Service
spring.cloud.gateway.server.webflux.routes[3].id=evaluation-route
spring.cloud.gateway.server.webflux.routes[3].uri=lb://evaluation-service
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/evaluations/**
spring.cloud.gateway.server.webflux.routes[3].filters[0]=JwtAuthFilter