server.port=8082
spring.application.name=test-engine-service

spring.datasource.url=jdbc:h2:mem:mhtcet_test_engine;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Target URL for Question Bank Service (later replaced by Eureka service discovery)
qbank.service.url=http://localhost:8081

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true